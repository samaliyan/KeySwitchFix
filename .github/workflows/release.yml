name: Release

on:
  push:
    branches: [main]

# Nothing here may write by default: the build job runs third-party tools
# (the Zig compiler from npm, wordfreq from PyPI) and must not hold a token
# that can change the repository. Only the publish job, which runs no
# downloaded code, gets write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build the release package
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wordfreq for the rank tables and language packs
        run: python3 -m pip install --quiet wordfreq==3.1.1

      - name: Install Zig cross-compiler
        run: >-
          npm install
          --cache "$RUNNER_TEMP/npm-cache"
          --prefix "$RUNNER_TEMP/keyswitchfix-zig"
          @oven/zig-linux-x64@0.12.0-dev.1286

      - name: Build release package
        env:
          ZIG: ${{ runner.temp }}/keyswitchfix-zig/node_modules/@oven/zig-linux-x64/zig
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
        run: chmod +x build-native.sh package-release.sh && bash ./package-release.sh

      - name: Hand the package to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/KeySwitchFix-Setup.exe
            dist/KeySwitchFix-Uninstall.exe
            dist/KeySwitchFix-*-Windows-x64.zip
            dist/KeySwitchFix-*-Windows-x64.zip.sha256
            dist/SHA256SUMS.txt

  publish:
    name: Tag and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch the package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Verify the package
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          cd dist
          sha256sum -c "KeySwitchFix-${VERSION}-Windows-x64.zip.sha256"
          grep -E ' (KeySwitchFix-Setup|KeySwitchFix-Uninstall)\.exe$' SHA256SUMS.txt | sha256sum -c -

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_TREE="$(git rev-parse "$TAG^{tree}")"
            HEAD_TREE="$(git rev-parse "HEAD^{tree}")"
            if [ "$TAG_TREE" != "$HEAD_TREE" ]; then
              echo "::error::Tag $TAG already points to different source. Bump VERSION before publishing."
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists for this exact source; nothing to do."
              exit 0
            fi
          else
            git tag -a "$TAG" -m "KeySwitchFix $VERSION"
            git push origin "$TAG"
          fi

          gh release create "$TAG" \
            "dist/KeySwitchFix-Setup.exe" \
            "dist/KeySwitchFix-Uninstall.exe" \
            "dist/KeySwitchFix-${VERSION}-Windows-x64.zip" \
            "dist/KeySwitchFix-${VERSION}-Windows-x64.zip.sha256" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "KeySwitchFix ${VERSION}" \
            --generate-notes
